name: Render deterministic 3D game assets

on:
  push:
    branches: [main]
    paths:
      - "tools/render/**"
      - ".github/workflows/render-game-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Build Home & More and Sophia v3.3 3D assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install off-screen 3D prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libxrender1 libsm6
          python -m pip install --quiet vtk pillow numpy trimesh
      - name: Generate geometry and motion captures
        run: |
          xvfb-run -a python tools/render/home_and_more_3d.py
          xvfb-run -a python tools/render/home_and_more_staff_3d.py
          xvfb-run -a python tools/render/make_sophia_motion.py
      - name: Pack runtime visual assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('tools/render')
          dest=Path('public/play/assets/procedural')
          dest.mkdir(parents=True,exist_ok=True)
          entries=[
            ('home_and_more_3d_render.png','home_and_more_shop_3d.webp',1900),
            ('home_and_more_staff_3d_render.png','home_and_more_staff_3d.webp',1440),
            # Sophia's six eight-way animation sheets are built by
            # make_sophia_motion.py and already compressed as WebP.
          ]
          for source,target,maxw in entries:
              im=Image.open(root/source)
              if im.width>maxw:
                  im=im.resize((maxw,round(im.height*maxw/im.width)),Image.Resampling.LANCZOS)
              im.save(dest/target,'WEBP',quality=93,method=6,exact=True)
              print(target,(dest/target).stat().st_size,'bytes')
          import shutil
          sophia=root/'sophia_motion_output'
          for asset in sorted(sophia.glob('sophia_*_8way.webp')):
              shutil.copyfile(asset,dest/asset.name)
              print(asset.name,(dest/asset.name).stat().st_size,'bytes')
          shutil.copyfile(sophia/'sophia_motion_metadata.json',dest/'sophia_motion_metadata.json')
          shutil.copyfile(sophia/'sophia_v3_3_with_chrome_84fs_unrigged.glb',
                          dest/'sophia_v3_3_with_chrome_84fs_unrigged.glb')
          for obsolete in dest.glob('saafiya_*'):
              obsolete.unlink() # superseded 2D sprite atlases only
          glb=root/'home_and_more_3d_scene.glb'
          if glb.exists(): shutil.copyfile(glb,dest/'home_and_more_shop_3d.glb')
          PY
      - name: Save generated assets in this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/play/assets/procedural/
          if git diff --cached --quiet; then
            echo 'No changed assets.'
          else
            git commit -m 'assets: render deterministic Home & More and Sophia v3.3 3D art'
            # Other PR updates may arrive while VTK is rendering. Preserve them.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo 'Procedural assets pushed successfully.'
                exit 0
              fi
              echo "Push raced another commit (attempt ${attempt}); retrying."
            done
            echo 'Could not publish assets without overwriting concurrent changes.'
            exit 1
          fi
