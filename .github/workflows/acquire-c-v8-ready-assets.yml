name: Acquire licensed premade meshes for C V8 trial
on:
  push:
    branches:
      - feat/c-v8-ready-made-assets
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact upstream Quaternius modular women meshes
        run: |
          set -euo pipefail
          mkdir -p downloaded
          for item in Soldier Adventurer Punk Casual Worker SciFi; do
            curl -fL --retry 3 --connect-timeout 15 -o "downloaded/${item}.glb" "https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/main/public/glb/modular_women/${item}.glb"
            test "$(stat -c%s "downloaded/${item}.glb")" -gt 400000
            sha256sum "downloaded/${item}.glb"
          done
          curl -fL --retry 3 -o downloaded/QUATERNIUS_LICENSES.md "https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/main/LICENSES.md"
          printf 'Source: https://github.com/trebeljahr/quaternius-showcase/tree/main/public/glb/modular_women\nCreator: Quaternius. For review; verify upstream license per model.\n' > downloaded/README.txt
      - name: Upload original donor models
        uses: actions/upload-artifact@v4
        with:
          name: C-V8-ready-made-Quaternius-donor-assets
          path: downloaded/
          retention-days: 30
