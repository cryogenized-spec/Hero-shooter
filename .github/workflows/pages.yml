name: Deploy Sophia 3D Scrapyard to GitHub Pages

on:
  push:
    branches:
      - feat/sophia-scrapyard-3d-playable-20261122
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-sophia
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the playable 3D project
        run: |
          npm run check
          npm test
          npm run build
      - name: Confirm all models are part of the Pages output
        run: |
          test -s dist/index.html
          test -s dist/src/sophia-demo.js
          test -s dist/play/assets/procedural/sophia/sophia_v33_articulated.glb
          test -s dist/play/assets/procedural/scrapyard/scrapyard_arena.glb
          test -s dist/play/assets/procedural/scrapyard/arena_navgrid.json
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the entire playable website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy static Sophia sandbox
        id: deployment
        uses: actions/deploy-pages@v4
