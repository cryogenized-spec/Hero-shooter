name: Publish Sophia 3D Sandbox on GitHub Pages

# GitHub Pages is currently configured to accept only deployments from main.
# This workflow RUNS on main, but builds the approved playable 3D sandbox
# from the feature branch. This leaves the legacy main application untouched
# until the 3D pull requests are reviewed and merged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sophia's 3D playable branch
        uses: actions/checkout@v4
        with:
          ref: feat/sophia-scrapyard-3d-playable-20261122
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build the static 3D demo
        run: |
          npm run check
          npm test
          npm run build
      - name: Publish a stable /sophia/ URL as well as the site root
        run: |
          mkdir -p dist/sophia
          cp dist/index.html dist/sophia/index.html
          cp -R dist/src dist/play dist/sophia/
      - name: Checkout C V8.1 sandbox from main without replacing Sophia
        uses: actions/checkout@v4
        with:
          ref: main
          path: c-main
          persist-credentials: false
      - name: Publish independent armed C arena at /c/
        run: |
          test -s c-main/public/c/index.html
          test -s c-main/public/c/c-demo.js
          test -s c-main/public/c/assets/C_V8_1_skull_refined_with_vest.glb.gz
          test -s c-main/public/c/assets/C_pink_compact_pistol.glb.gz
          test -s c-main/public/c/assets/p226-report-0.wav
          mkdir -p dist/c
          cp -a c-main/public/c/. dist/c/
          python - <<'PY'
          from pathlib import Path
          for page,href in [(Path("dist/index.html"),"c/"),(Path("dist/sophia/index.html"),"../c/")]:
              html=page.read_text()
              link=f'<a href="{href}" style="position:fixed;z-index:9;right:16px;top:15px;padding:8px 12px;background:#18222b;border:1px solid #ffae7b;color:#ffe0bb;border-radius:7px;font:700 12px system-ui;text-decoration:none">C V8.1 ARMED ARENA</a>'
              html=html.replace("<div id=\"hint\">",link+"<div id=\"hint\">",1)
              page.write_text(html)
          PY
      - name: Checkout C Golden Dragon mall scene
        uses: actions/checkout@v4
        with:
          ref: feat/c-golden-dragon-mall-level-20261122
          path: c-mall-src
          persist-credentials: false
      - name: Publish separate playable Chinese-shop level at /c-mall/
        run: |
          mkdir -p dist/c-mall dist/play/assets/procedural
          cp -a c-mall-src/public/c-mall/. dist/c-mall/
          cp c-main/public/play/assets/procedural/mr_chen_hybrid_face_v2.glb dist/play/assets/procedural/
          node --check dist/c-mall/mall-scene.js
          node --check dist/c-mall/mall-geometry.js
          test -s dist/c-mall/index.html
          test -s dist/c-mall/assets/c_portrait.webp
          test -s dist/c-mall/mall-scene.js
          test -s dist/c-mall/mall-geometry.js
          test -s dist/play/assets/procedural/mr_chen_hybrid_face_v2.glb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/c/index.html')
          t=p.read_text()
          link='<a class="btn" href="../c-mall/" style="border-color:#d1a074;color:#ffe0ae">GOLDEN DRAGON MALL</a>'
          t=t.replace('<a id="back"',link+'<a id="back"',1)
          p.write_text(t)
          PY
      - name: Checkout the verified original-link Sophia gait comparison
        uses: actions/checkout@v4
        with:
          ref: feat/sophia-makehuman-prefab-20261122
          path: sophia-preview-src
          persist-credentials: false
      - name: Publish exact-link Sophia gait comparison at /sophia-walk/
        run: |
          src=sophia-preview-src/public
          dest=dist/sophia-walk
          mkdir -p "$dest/play/assets/procedural/sophia_prefab"
          cp "$src/sophia-shared-walk.html" "$dest/index.html"
          cp "$src/sophia-shared-walk.js" "$dest/sophia-shared-walk.js"
          cp "$src/play/assets/procedural/sophia_prefab/sophia_from_shared_settings.glb" "$dest/play/assets/procedural/sophia_prefab/sophia_from_shared_settings.glb"
          test -s "$dest/index.html"
          test -s "$dest/sophia-shared-walk.js"
          test -s "$dest/play/assets/procedural/sophia_prefab/sophia_from_shared_settings.glb"
      - name: Checkout Sophia's gothic clothes review branch
        uses: actions/checkout@v4
        with:
          ref: feat/sophia-gothic-wardrobe-20261122
          path: sophia-outfits-src
          persist-credentials: false
      - name: Publish interactive gothic wardrobe at /sophia-outfit/
        run: |
          source=sophia-outfits-src/public
          dest=dist/sophia-outfit
          mkdir -p "$dest/play/assets/procedural/sophia_prefab"
          cp "$source/sophia-wardrobe.html" "$dest/index.html"
          cp "$source/sophia-wardrobe.js" "$dest/sophia-wardrobe.js"
          cp "$source/sophia-gothic-accents.js" "$dest/sophia-gothic-accents.js"
          cp "$source/play/assets/procedural/sophia_prefab/sophia_gothic_street.glb" "$dest/play/assets/procedural/sophia_prefab/"
          cp "$source/play/assets/procedural/sophia_prefab/sophia_gothic_dress.glb" "$dest/play/assets/procedural/sophia_prefab/"
          test -s "$dest/index.html"
          test -s "$dest/sophia-wardrobe.js"
          test -s "$dest/sophia-gothic-accents.js"
          test -s "$dest/play/assets/procedural/sophia_prefab/sophia_gothic_street.glb"
          test -s "$dest/play/assets/procedural/sophia_prefab/sophia_gothic_dress.glb"
      - name: Ensure Sophia and the VTK arena are in the built website
        run: |
          test -s dist/index.html
          test -s dist/src/sophia-demo.js
          test -s dist/play/assets/procedural/sophia/sophia_v33_articulated.glb
          test -s dist/play/assets/procedural/scrapyard/scrapyard_arena.glb
          test -s dist/play/assets/procedural/scrapyard/arena_navgrid.json
          test -s dist/play/assets/procedural/scrapyard/arena_layout.json
          test -s dist/sophia/index.html
          test -s dist/sophia/src/sophia-demo.js
          test -s dist/c/index.html
          test -s dist/c/c-demo.js
          test -s dist/c/assets/C_V8_1_skull_refined_with_vest.glb.gz
          test -s dist/c/assets/C_pink_compact_pistol.glb.gz
          test -s dist/sophia/play/assets/procedural/sophia/sophia_v33_articulated.glb
          test -s dist/sophia/play/assets/procedural/scrapyard/scrapyard_arena.glb
          test -s dist/sophia-outfit/index.html
          test -s dist/sophia-outfit/sophia-gothic-accents.js
          test -s dist/sophia-outfit/play/assets/procedural/sophia_prefab/sophia_gothic_street.glb
          test -s dist/sophia-outfit/play/assets/procedural/sophia_prefab/sophia_gothic_dress.glb
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish from main's authorized Pages workflow
        id: deployment
        uses: actions/deploy-pages@v4
