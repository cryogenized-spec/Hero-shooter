name: Publish Sophia 3D Game on GitHub Pages (after merge)

# Until the feature PR merges, the live Pages website is published from
# main's Pages workflow. This file only runs when the 3D game reaches main,
# which matches the repository's GitHub Pages deployment branch policy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run check
          npm test
          npm run build
      - name: Check static 3D files
        run: |
          test -s dist/index.html
          test -s dist/src/sophia-demo.js
          test -s dist/play/assets/procedural/sophia/sophia_v33_articulated.glb
          test -s dist/play/assets/procedural/scrapyard/scrapyard_arena.glb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
