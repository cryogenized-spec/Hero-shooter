name: Assemble approved Phoenix, Arise! MP3
on:
  push:
    branches:
      - feat/c-portrait-phoenix-track-20261119
    paths:
      - .github/workflows/import-phoenix-arise.yml
      - scripts/import-phoenix-arise.mjs
      - .asset-import/phoenix-arise/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reassemble and verify byte-perfect original
        run: node scripts/import-phoenix-arise.mjs
      - name: Commit verified soundtrack and clear one-off staging
        run: |
          git add public/assets/music/phoenix-arise.mp3
          git rm -r .asset-import/phoenix-arise scripts/import-phoenix-arise.mjs .github/workflows/import-phoenix-arise.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "assets: publish original Phoenix, Arise! MP3 and remove staging"
          git push
