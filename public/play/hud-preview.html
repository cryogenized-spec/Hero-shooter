<!DOCTYPE html>

<head>

<title>Hero Shooter · Ornate HUD + Weapon Selector Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#14141a;color:#eee;overflow:hidden;font-family:system-ui}
.demo{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#414d53 0%,#202731 60%,#121820 100%)}

.legend h2{font-family:Georgia,serif;color:#e5bb9e;font-weight:normal}

<body class="shop-mode">
